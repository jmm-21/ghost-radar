name: CI/CD

# Cada push y cada pull request pasan por todas las fases.
# Solo un push a main que las supere todas llega a producción.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Tests unitarios con cobertura
        run: npm run test:coverage

      - name: Resumen de cobertura
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k, n) => `| ${n} | ${t[k].pct} % |`;
            console.log(["### Cobertura de tests", "| Métrica | % |", "|---|---|",
              row("lines","Líneas"), row("statements","Sentencias"), row("functions","Funciones"), row("branches","Ramas")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build de producción
        run: npx vite build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: Tests E2E (escritorio y móvil)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (rendimiento, accesibilidad, SEO)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Lighthouse CI
        run: npm run lighthouse
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy:
    name: Desplegar a producción
    needs: [e2e, lighthouse]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ghost-radar-rrss.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Comprobar credenciales de Vercel
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Faltan los secretos de Vercel; se omite el despliegue."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Descargar configuración de producción
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build de Vercel
        if: steps.creds.outputs.ok == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Publicar
        if: steps.creds.outputs.ok == 'true'
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Publicado en $url"
          echo "### Desplegado en producción" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comprobar que la web responde
        if: steps.creds.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://ghost-radar-rrss.vercel.app/) && [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "La web no responde con 200"; exit 1
